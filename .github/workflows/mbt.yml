name: MBT
on:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches: main

jobs:
  changes:
    name: Detect changes
    runs-on: ${{ github.repository_owner == 'circlefin' && 'github-hosted-small' || 'ubuntu-24.04' }}
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - id: filter
        name: Check relevant paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: ./scripts/quint-ci-changes.sh specs code scripts/quint-ci-changes.sh .github/workflows/mbt.yml

  mbt-tests:
    name: MBT Tests
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ${{ github.repository_owner == 'circlefin' && 'github-hosted-large' || 'ubuntu-24.04' }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_RELEASE_DEBUG: 1
      RUST_BACKTRACE: short
      CARGO_NET_RETRY: 10
      RUSTUP_MAX_RETRIES: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install Quint
        run: make -C code install-quint
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@554bdce7edf79d43854a6b7c1e392e7da7eb97a9 # cargo-nextest
      - name: Current time as random seed for Quint
        run: echo "QUINT_SEED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Initialize the native evaluator before concurrent replays
        run: |
          quint run specs/consensus/quint/tests/votekeeper/voteReplaySampling.qnt \
            --backend=rust --seed="$QUINT_SEED" --observation=emitSkip --max-steps=24 --max-samples=1 --verbosity=1
      - name: Build MBT
        working-directory: code
        run: cargo nextest run --locked -p arc-malachitebft-test-mbt --all-features --no-run
      - name: Replay Rust evaluator traces
        working-directory: code
        env:
          QUINT_BACKEND: rust
        run: cargo nextest run --locked -p arc-malachitebft-test-mbt --all-features
      - name: Replay TypeScript evaluator traces
        working-directory: code
        env:
          QUINT_BACKEND: typescript
        run: cargo nextest run --locked -p arc-malachitebft-test-mbt --all-features
