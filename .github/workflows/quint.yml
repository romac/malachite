on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: main

name: Quint

jobs:
  changes:
    name: Detect changes
    runs-on: ${{ github.repository_owner == 'circlefin' && 'github-hosted-small' || 'ubuntu-24.04' }}
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - id: filter
        name: Check relevant paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: ./scripts/quint-ci-changes.sh specs 'scripts/quint-*' code/Makefile .github/workflows/quint.yml

  quint-typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ${{ github.repository_owner == 'circlefin' && 'github-hosted-small' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - run: make -C code install-quint
      - run: find specs/ -name '*.qnt' | ./scripts/quint-forall.sh typecheck

  quint-test:
    name: Test (${{ matrix.backend }})
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ${{ github.repository_owner == 'circlefin' && 'github-hosted-large' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        backend: [rust, typescript]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - run: make -C code install-quint
      - name: Run standalone suites
        run: ./scripts/quint-tests.py --backend ${{ matrix.backend }} --seed 118
      - name: Sample ValueSync invariants and observations
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          quint run specs/synchronization/valuesync/client-model/valuesync.qnt --main=vs \
            --backend=${{ matrix.backend }} --seed=118 --max-steps=30 --max-samples=1000 \
            --out-itf="$RUNNER_TEMP/valuesync.itf.json" --verbosity=2 | tee "$RUNNER_TEMP/valuesync.log"
          for goal in wStarted wPending wParallel wPlaceholder wRetried wRetriedReservation \
                      wPrunedStatus wProgress wCaughtUp wReroutedPastDisconnected; do
            grep -E "^$goal was observed in [1-9][0-9]* trace" "$RUNNER_TEMP/valuesync.log"
          done

  quint-verify:
    name: Verify proposal-part streaming
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ${{ github.repository_owner == 'circlefin' && 'github-hosted-large' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - run: make -C code install-quint
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Check the invariant and reach both stream observations
        working-directory: specs/block-streaming
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          quint verify part_stream.qnt --backend=apalache --max-steps=4 --search-observations | tee "$RUNNER_TEMP/stream.log"
          grep -Fx 'finBeforeInit was observed' "$RUNNER_TEMP/stream.log"
          grep -Fx 'completeStream was observed' "$RUNNER_TEMP/stream.log"
